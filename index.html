function renderProgress() {
  const el = $('#progress'); const f = state.fetching;
  if (!f) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<div class="top"><span>Hämtar från Scryfall… ${f.current}/${f.total}</span><button data-action="cancel-fetch">Avbryt</button></div>
    <div class="track"><div class="fill" style="width:${(f.current / f.total) * 100}%"></div></div><div class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.note || f.name)}</div>`;
}

function modalCard(m) {
  const key = state.modal.key;
  const card = m.cards.find(c => c.key === key);
  if (card) return card;
  // Kort som finns i ett deck men inte på jaktlistan (t.ex. redan ägt eller filtrerat)
  const c = state.cache[key]; const e = state.decks.flatMap(d => parseList(d.text)).find(x => x.key === key);
  if (!e) return null;
  const prints = (c && c.prints) || [];
  return { ...e, name: (c && c.name) || e.input, prints, cheapest: prints[0] || null, error: c && c.error, approx: false, found: !!state.found[key], sources: [] };
}

function renderModal(m) {
  const el = $('#modal');
  if (!state.modal) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  if (state.modal.type === 'deck') return renderDeckEditor(el);
  const card = modalCard(m);
  if (!card) { state.modal = null; el.hidden = true; return; }
  const sel = Math.min(state.modal.sel || 0, Math.max(card.prints.length - 1, 0));
  const ref = card.prints[sel];
  const big = ref && (ref.imgN || ref.img);
  let cmp = '';
  if (ref) {
    const store = state.modal.store;
    let res = '';
    if (store > 0) {
      const cmSek = price(ref) * state.settings.sekRate;
      const diff = store - cmSek, pct = Math.round((diff / cmSek) * 100);
      res = diff <= 0 ? `<div class="res good">${I('check-circle')} ${Math.abs(Math.round(diff))} kr billigare än Cardmarket-trend (${Math.abs(pct)} %) – bra deal!</div>`
        : pct <= 25 ? `<div class="res">≈ ${Math.round(diff)} kr dyrare än trend (+${pct} %). Med frakt online är det nära nog.</div>`
        : `<div class="res bad">${I('alert')} ${Math.round(diff)} kr dyrare än trend (+${pct} %).</div>`;
    }
    const qty = state.modal.qty || Math.max(1, card.qty || 1);
    const inCart = state.cart.filter(x => x.key === card.key);
    cmp = `<div class="cmp"><b>Butikens pris</b> <span class="muted">jämfört med ${esc(ref.set)} #${esc(ref.cn)} · ${fmtEur(price(ref))} ≈ ${fmtSek(price(ref))}</span>
      <div class="inline" style="margin-top:8px"><input class="txt" id="storeprice" type="number" inputmode="decimal" placeholder="Pris i butiken, kr/st" value="${store || ''}"></div>${res}
      <div class="inline" style="margin-top:12px"><div class="have"><div class="step"><button data-action="modal-qty" data-v="-1" aria-label="Färre">−</button><span>${qty}</span><button data-action="modal-qty" data-v="1" aria-label="Fler">+</button></div></div>
        <button class="btn" style="flex:1" data-action="cart-add">${I('cart')} Lägg i köplistan${store > 0 ? ' · ' + fmtKr(store * qty) : ''}</button></div>
      ${inCart.length ? `<p class="muted" style="margin:8px 0 0">I köplistan: ${inCart.map(x => `${esc(x.set)} ×${x.qty}${x.price ? ' à ' + x.price + ' kr' : ''}`).join(', ')}</p>` : ''}</div>`;
  }
  const decksNeed = card.sources.length ? `<p class="muted">Behövs till: ${card.sources.map(s => `<b>${esc(s.deck.name)}</b>${s.need > 1 ? ' ×' + s.need : ''}`).join(', ')}</p>` : '';
  el.innerHTML = `<div class="sheet"><div class="handle"></div><button class="close" data-action="modal-close" aria-label="Stäng">×</button>
    <div class="head">${big ? `<img src="${esc(big)}" alt="">` : ''}<div>
      <h2>${esc(card.name)}</h2>
      ${card.approx ? `<p class="muted">Du skrev: "${esc(card.input)}"</p>` : ''}
      ${decksNeed}
      <p class="muted">${card.prints.length} printings med pris${card.cheapest ? ` · billigast ${fmtEur(price(card.cheapest))} (${esc(card.cheapest.set)})` : ''}</p>
      <label class="inline"><input type="checkbox" class="chk" data-action="found" data-key="${esc(card.key)}" ${card.found ? 'checked' : ''}> Hittad / köpt</label>
      <p class="links" style="margin-top:10px">${ref && ref.cm ? `<a href="${esc(ref.cm)}" target="_blank" rel="noopener">Cardmarket ↗</a>` : ''}${ref && ref.sf ? `<a href="${esc(ref.sf)}" target="_blank" rel="noopener">Scryfall ↗</a>` : ''}</p>
    </div></div>
    ${cmp}
    ${card.error ? `<div class="note err" style="margin-top:12px">${esc(card.error)}</div>` : ''}
    ${card.prints.length ? `<h2 style="margin-top:16px">Alla printings <span class="muted">billigast först · tryck för att välja referens</span></h2>` : ''}
    ${card.hiddenPrints ? `<p class="muted">${card.hiddenPrints} printings dolda (The List m.fl.) – ändra under Mer.</p>` : ''}
    ${card.prints.map((p, i) => `<div class="prow ${i === sel ? 'sel' : ''}" data-action="modal-sel" data-i="${i}">
      ${setIcon(p.set)}
      <div style="flex:1;min-width:0"><div class="nm">${i === 0 ? STAR + ' ' : ''}${esc(p.setName)} <span class="muted mono" style="font-weight:700">${esc(p.set)}</span> <span class="muted">${esc((p.released || '').slice(0, 4))}</span></div>
        <div class="sub"><span>${rar(p.rarity)} #${esc(p.cn)}</span>${p.foilOnly ? '<span>endast foil</span>' : ''}${p.tags.length ? `<span>${esc(p.tags.join(', '))}</span>` : ''}${p.eurFoil != null && p.eur != null ? `<span>foil ${fmtEur(p.eurFoil)}</span>` : ''}</div></div>
      <div class="pr">${badge(p)}${state.settings.showSek ? `<span class="sek">${fmtSek(price(p))}</span>` : ''}</div>
    </div>`).join('')}
  </div>`;
}

function renderDeckEditor(el) {
  const d = state.decks.find(x => x.id === state.modal.id);
  el.innerHTML = `<div class="sheet"><div class="handle"></div><button class="close" data-action="modal-close" aria-label="Stäng">×</button>
    <h2 style="font-size:19px;margin-bottom:12px">${d ? I('pencil') + ' Redigera deck' : I('plus') + ' Nytt deck'}</h2>
    <div class="field"><label>Namn</label><input class="txt" id="deckname" placeholder="t.ex. Animar EDH" value="${esc(d ? d.name : '')}"></div>
    <div class="field"><label>Kortlista</label><textarea id="decktext" spellcheck="false" placeholder="1 Animar, Soul of Elements&#10;4 Lightning Bolt&#10;Sol Ring&#10;…">${esc(d ? d.text : '')}</textarea>
      <p class="muted" style="margin-top:6px">Ett kort per rad, gärna med antal. Klistra in direkt från Arena, Moxfield, Archidekt eller MTGO – setkoder och foil-markeringar filtreras bort. Rader med <kbd>#</kbd> ignoreras.</p></div>
    <div class="btnrow"><button class="btn" data-action="deck-save" data-id="${esc(d ? d.id : '')}">${I('save')} Spara</button><button class="btn ghost" data-action="modal-close">Avbryt</button></div>
  </div>`;
  if (!d) setTimeout(() => { const n = $('#deckname'); if (n) n.focus(); }, 50);
}

// ---------- Export ----------
function shoppingText(m) {
  const bySet = {};
  for (const c of m.cards) if (c.cheapest && !c.found) (bySet[c.cheapest.set] = bySet[c.cheapest.set] || []).push(c);
  const lines = [];
  for (const set of Object.keys(bySet).sort()) {
    const cs = bySet[set].sort((a, b) => a.name.localeCompare(b.name, 'sv'));
    lines.push(`${set} – ${cs[0].cheapest.setName}`);
    for (const c of cs) lines.push(`  ${c.qty > 1 ? c.qty + '× ' : ''}${c.name} (#${c.cheapest.cn}, ${fmtEur(price(c.cheapest))})`);
  }
  return lines.join('\n');
}
function csvText(m) {
  const cell = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const rows = [['Set', 'Setnamn', 'Kort', 'Antal', 'Nr', 'Rarity', 'Pris EUR', 'Pris SEK', 'Hittad', 'Behövs till', 'Alt 1', 'Alt 2', 'Cardmarket']];
  for (const c of m.cards) {
    const p = c.cheapest || {};
    rows.push([p.set, p.setName, c.name, c.qty, p.cn, p.rarity, price(p) != null ? price(p).toFixed(2) : '', price(p) != null ? Math.round(price(p) * state.settings.sekRate) : '',
      c.found ? 'ja' : 'nej', c.sources.map(s => s.deck.name + (s.need > 1 ? ' x' + s.need : '')).join(', '),
      c.prints[1] ? `${c.prints[1].set} ${price(c.prints[1]).toFixed(2)}` : '', c.prints[2] ? `${c.prints[2].set} ${price(c.prints[2]).toFixed(2)}` : '', p.cm]);
  }
  return '﻿' + rows.map(r => r.map(cell).join(';')).join('\r\n');
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Kopierat'); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Kopierat'); }
}

// ---------- Deck-åtgärder ----------
function deckById(id) { return state.decks.find(d => d.id === id); }
function setHave(id, key, n) {
  const d = deckById(id); if (!d) return;
  const e = parseList(d.text).find(x => x.key === key); if (!e) return;
  n = Math.max(0, Math.min(e.qty, n));
  if (n) d.have[key] = n; else delete d.have[key];
  save(LS.decks, state.decks); render();
}
function bookFound() {
  const keys = Object.keys(state.found);
  if (!keys.length) return;
  let n = 0;
  for (const d of state.decks) for (const e of parseList(d.text)) if (state.found[e.key] && (d.have[e.key] || 0) < e.qty) { d.have[e.key] = e.qty; n++; }
  state.found = {};
  save(LS.decks, state.decks); save(LS.found, state.found); render();
  toast(`${keys.length} kort bokförda som ägda (${n} deckrader)`);
}

// ---------- Händelser ----------
function setTab(t) { state.tab = t; save(LS.tab, t); window.scrollTo(0, 0); render(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action; const m = () => model();
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  switch (a) {
    case 'noop': break; // t.ex. brytarens label – klicket ska inte bubbla vidare till raden
    case 'tab': setTab(el.dataset.tab); break;
    case 'found': {
      const k = el.dataset.key; if (el.checked) state.found[k] = true; else delete state.found[k];
      save(LS.found, state.found); render(); break;
    }
    case 'detail': state.modal = { type: 'card', key: el.dataset.key, sel: 0, store: '' }; render(); break;
    case 'modal-close': state.modal = null; render(); break;
    case 'modal-sel': state.modal.sel = +el.dataset.i; render(); break;
    case 'modal-qty': { const c = modalCard(m()); const cur = state.modal.qty || Math.max(1, (c && c.qty) || 1); state.modal.qty = Math.max(1, cur + (+el.dataset.v)); render(); break; }
    case 'cart-add': {
      const c = modalCard(m()); if (!c || !c.prints.length) break;
      const ref = c.prints[Math.min(state.modal.sel || 0, c.prints.length - 1)];
      const qty = state.modal.qty || Math.max(1, c.qty || 1);
      const p = state.modal.store > 0 ? +state.modal.store : null;
      const ex = state.cart.find(x => x.key === c.key && x.set === ref.set && x.cn === ref.cn);
      if (ex) { ex.qty += qty; if (p != null) ex.price = p; }
      else state.cart.push({ id: uid(), key: c.key, name: c.name, set: ref.set, setName: ref.setName, cn: ref.cn, qty, price: p, cm: price(ref), added: Date.now() });
      state.found[c.key] = true;
      save(LS.found, state.found); save(LS.cart, state.cart);
      state.modal = null; render(); toast(`${c.name} ligger i köplistan (${cartCount()} kort)`); break;
    }
    case 'cart-qty': { const x = state.cart.find(x => x.id === el.dataset.id); if (x) { x.qty = Math.max(1, x.qty + (+el.dataset.v)); save(LS.cart, state.cart); render(); } break; }
    case 'cart-remove': { const x = state.cart.find(x => x.id === el.dataset.id); if (x) { state.cart = state.cart.filter(y => y !== x); if (!state.cart.some(y => y.key === x.key)) delete state.found[x.key]; save(LS.cart, state.cart); save(LS.found, state.found); render(); } break; }
    case 'cart-clear': if (confirm('Töm köplistan? Bockarna för "hittad" behålls.')) { state.cart = []; save(LS.cart, state.cart); render(); } break;
    case 'cart-copy': copyText(cartText()); break;
    case 'cart-done': if (confirm('Markera alla kort i köplistan som ägda i dina decks och töm listan?')) cartDone(); break;
    case 'sync-connect': { const t = ($('#synctoken').value || '').trim(); if (!t) { toast('Klistra in en token först'); break; } connectSync(t); break; }
    case 'sync-now': pullSync(true); break;
    case 'sync-disconnect': if (confirm('Koppla från GitHub-synk på den här enheten?')) disconnectSync(); break;
    case 'backup-download': downloadFile(`MTG_Kortjakt_backup_${new Date().toISOString().slice(0, 10)}.json`, backupJSON(), 'application/json'); break;
    case 'backup-restore': $('#restorefile').click(); break;
    case 'receipt-show': state.receipt = true; render(); break;
    case 'receipt-close': state.receipt = false; render(); break;
    case 'setsort': state.settings.setSort = el.dataset.v; save(LS.settings, state.settings); render(); break;
    case 'cardsort': state.settings.cardSort = el.dataset.v; save(LS.settings, state.settings); render(); break;
    case 'togglehide': state.settings.hideFound = !state.settings.hideFound; save(LS.settings, state.settings); render(); break;
    case 'togglecheapest': state.settings.onlyCheapest = !state.settings.onlyCheapest; save(LS.settings, state.settings); render(); break;
    case 'togglespecial': state.settings.hideSpecial = !state.settings.hideSpecial; save(LS.settings, state.settings); render(); break;
    case 'toggle-special-chk': state.settings.hideSpecial = el.checked; save(LS.settings, state.settings); render(); break;
    case 'fetch-missing': fetchAll(true); break;
    case 'refresh-all': if (confirm('Hämta om priser för alla saknade kort? Bockar och decks påverkas inte.')) fetchAll(false); break;
    case 'cancel-fetch': if (state.fetching) state.fetching.cancel(); break;
    case 'rate-save': { const v = parseFloat(($('#rate').value || '').replace(',', '.')); if (v > 0) { state.settings.sekRate = v; state.settings.rateDate = null; save(LS.settings, state.settings); toast('Kurs sparad'); render(); } break; }
    case 'rate-fetch': fetchRate(false); break;
    case 'toggle-sek': state.settings.showSek = el.checked; save(LS.settings, state.settings); render(); break;
    case 'copy': copyText(shoppingText(m())); break;
    case 'csv': {
      const blob = new Blob([csvText(m())], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = 'MTG_Kortjakt.csv';
      document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); break;
    }
    case 'clear-found': if (confirm('Nollställ alla bockar för "hittad"?')) { state.found = {}; save(LS.found, state.found); render(); } break;
    case 'clear-cache': if (confirm('Rensa all hämtad prisdata? Decks och bockar behålls.')) { state.cache = {}; save(LS.cache, state.cache); render(); } break;
    case 'book-found': if (confirm('Markera alla hittade kort som ägda i dina decks och töm bockarna?')) bookFound(); break;
    // Decks
    case 'deck-new': state.modal = { type: 'deck', id: null }; render(); break;
    case 'deck-edit': state.modal = { type: 'deck', id: el.dataset.id }; render(); break;
    case 'deck-open': state.deckId = el.dataset.id; window.scrollTo(0, 0); render(); break;
    case 'deck-back': state.deckId = null; render(); break;
    case 'deck-active': { const d = deckById(el.dataset.id); if (d) { d.active = el.checked; save(LS.decks, state.decks); render(); if (d.active && wantEntries().some(e => !state.cache[e.key])) fetchAll(true); } break; }
    case 'deck-active-toggle': { const d = deckById(el.dataset.id); if (d) { d.active = d.active === false; save(LS.decks, state.decks); render(); toast(d.active ? 'Decket ingår i jaktlistan' : 'Decket är utelämnat från jaktlistan'); if (d.active && wantEntries().some(e => !state.cache[e.key])) fetchAll(true); } break; }
    case 'deckfilter': state.settings.deckFilter = el.dataset.id || null; save(LS.settings, state.settings); render(); break;
    case 'deck-save': {
      const name = ($('#deckname').value || '').trim() || 'Namnlöst deck';
      const text = $('#decktext').value || '';
      const d = deckById(el.dataset.id);
      if (d) { d.name = name; d.text = text; }
      else { const nd = { id: uid(), name, text, have: {}, created: Date.now() }; state.decks.push(nd); state.deckId = nd.id; }
      save(LS.decks, state.decks); state.modal = null; render();
      const missing = wantEntries().filter(e => !state.cache[e.key]).length;
      if (missing && navigator.onLine) fetchAll(true); else toast('Sparat');
      break;
    }
    case 'deck-delete': { const d = deckById(el.dataset.id); if (d && confirm(`Ta bort "${d.name}"?`)) { state.decks = state.decks.filter(x => x !== d); state.deckId = null; save(LS.decks, state.decks); render(); } break; }
    case 'deck-all': { const d = deckById(el.dataset.id); if (!d) break; d.have = {}; if (el.dataset.v === '1') for (const e of parseList(d.text)) d.have[e.key] = e.qty; save(LS.decks, state.decks); render(); break; }
    case 'have-toggle': { const d = deckById(el.dataset.id); const e = d && parseList(d.text).find(x => x.key === el.dataset.key); if (e) setHave(d.id, e.key, el.checked ? e.qty : 0); break; }
    case 'have-toggle-all': { const d = deckById(el.dataset.id); const e = d && parseList(d.text).find(x => x.key === el.dataset.key); if (e) setHave(d.id, e.key, (d.have[e.key] || 0) >= e.qty ? 0 : e.qty); break; }
    case 'have-inc': { const d = deckById(el.dataset.id); if (d) setHave(d.id, el.dataset.key, (d.have[el.dataset.key] || 0) + 1); break; }
    case 'have-dec': { const d = deckById(el.dataset.id); if (d) setHave(d.id, el.dataset.key, (d.have[el.dataset.key] || 0) - 1); break; }
  }
});
document.addEventListener('change', e => {
  if (e.target.classList && e.target.classList.contains('cartprice')) render();
  if (e.target.id === 'restorefile' && e.target.files && e.target.files[0]) {
    const f = e.target.files[0];
    if (!confirm(`Ersätt decks, bockar och köplista på den här enheten med innehållet i "${f.name}"?`)) { e.target.value = ''; return; }
    f.text().then(t => restoreBackup(t)).catch(err => toast('Kunde inte återställa: ' + err.message, 4000));
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'synctoken') { const t = e.target.value.trim(); if (t) connectSync(t); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && syncOn()) pullSync(false); });
window.addEventListener('online', () => { if (syncOn() && state.sync.dirty) pushSync(); });
document.addEventListener('input', e => {
  if (e.target.classList && e.target.classList.contains('cartprice')) {
    const x = state.cart.find(x => x.id === e.target.dataset.id);
    if (x) { const v = parseFloat(e.target.value.replace(',', '.')); x.price = v > 0 ? v : null; save(LS.cart, state.cart); }
    return;
  }
  if (e.target.id === 'storeprice' && state.modal) {
    state.modal.store = parseFloat(e.target.value.replace(',', '.')) || '';
    const pos = e.target.selectionStart; renderModal(model());
    const inp = $('#storeprice'); if (inp) { inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (err) {} }
  }
});
document.addEventListener('toggle', e => {
  const d = e.target; if (d.classList && d.classList.contains('set') && !state.query) {
    if (d.open) state.open[d.dataset.set] = true; else delete state.open[d.dataset.set];
    save(LS.open, state.open);
  }
}, true);
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); });
let qT; $('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { state.query = e.target.value; if (state.tab === 'more') state.tab = 'set'; render(); }, 120); });
$('#q-clear').addEventListener('click', () => { $('#q').value = ''; state.query = ''; render(); $('#q').focus(); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') { state.modal = null; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (state.modal || state.receipt)) { state.modal = null; state.receipt = false; render(); } });

// ---------- Start ----------
document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = I(el.dataset.icon); });
render();
const rateAge = state.settings.rateDate ? (Date.now() - new Date(state.settings.rateDate)) / 864e5 : 99;
if (navigator.onLine && rateAge > 1) fetchRate(true);
// Hämta priser automatiskt för kort som saknar prisdata (t.ex. första starten eller ny webbläsare)
if (navigator.onLine && wantEntries().some(e => !state.cache[e.key])) setTimeout(() => fetchAll(true), 400);
// Set-symbolregistret, max en gång per 30 dagar
if (navigator.onLine && Date.now() - (state.setIcons.fetchedAt || 0) > 30 * 864e5) setTimeout(fetchSetIcons, 1500);
// Uppstarten är klar – från och med nu räknas sparningar som ändringar att synka
applyingRemote = false;
if (syncOn() && navigator.onLine) setTimeout(() => pullSync(false), 600);
</script>
</body>
</html>
